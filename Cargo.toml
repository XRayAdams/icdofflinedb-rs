[package]
name = "icdofflinedb"
version = "2.0.2+23"
edition = "2024"
authors = ["Konstantin Adamov <xrayadamo@gmail.com>"]
description = "ICD 10 and ICD 9offline database."
license = "MIT"
repository = "https://github.com/XRayAdams/icdofflinedb-rs"

[dependencies]
relm4 = { version = "0.10.0", features = ["libadwaita"] }
relm4-macros = { version = "0.10.0"}
relm4-components = "0.10.0"

gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_5"] }
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
rusqlite = { version = "0.38.0", features = ["bundled"] }
